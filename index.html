<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background: #0f0c29;
    }

    /* Анимированный фон */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
    }

    .bg::before,
    .bg::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
    }

    .bg::before {
      width: 400px;
      height: 400px;
      background: #667eea;
      top: -100px;
      right: -100px;
    }

    .bg::after {
      width: 350px;
      height: 350px;
      background: #f093fb;
      bottom: -80px;
      left: -80px;
      animation-delay: -4s;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 {
      width: 200px;
      height: 200px;
      background: #764ba2;
      top: 40%;
      left: 10%;
      animation: float 10s ease-in-out infinite reverse;
    }

    .orb-2 {
      width: 150px;
      height: 150px;
      background: #4facfe;
      bottom: 20%;
      right: 15%;
      animation: float 7s ease-in-out infinite;
      animation-delay: -2s;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Карточка */
    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 540px;
      width: 100%;
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f093fb;
      background: rgba(240, 147, 251, 0.12);
      border: 1px solid rgba(240, 147, 251, 0.25);
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
      animation: badgePulse 3s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240, 147, 251, 0.3); }
      50% { box-shadow: 0 0 0 8px rgba(240, 147, 251, 0); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.25;
      background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShine 4s ease-in-out infinite;
    }

    @keyframes titleShine {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.15); }
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 36px;
      animation: fadeIn 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      cursor: default;
      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
      animation: itemEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateX(-20px);
    }

    li:nth-child(1) { animation-delay: 0.4s; }
    li:nth-child(2) { animation-delay: 0.55s; }
    li:nth-child(3) { animation-delay: 0.7s; }

    @keyframes itemEnter {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    li:hover {
      transform: translateX(8px) scale(1.02);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(102, 126, 234, 0.4);
      box-shadow:
        0 8px 32px rgba(102, 126, 234, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    li:hover .icon {
      transform: scale(1.15) rotate(-5deg);
    }

    li:nth-child(1) .icon {
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    li:nth-child(2) .icon {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
    }

    li:nth-child(3) .icon {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      margin: 32px 0 0;
      animation: fadeIn 0.8s 0.9s forwards;
      opacity: 0;
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
      animation: fadeIn 0.8s 1s forwards;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="badge">✦ Контент-студия</div>
    <h1>Генератор идей для постов</h1>
    <p class="subtitle">Выберите формат — и начинайте творить</p>

    <ul>
      <li>
        <span class="icon">📝</span>
        5 идей постов экспертов
      </li>
      <li>
        <span class="icon">📱</span>
        3 идеи сторис на сегодня
      </li>
      <li>
        <span class="icon">📅</span>
        Контент план на неделю
      </li>
    </ul>

    <div class="divider"></div>
    <p class="footer-note">Идеи обновляются каждый день</p>
  </div>
</body>
</html>
